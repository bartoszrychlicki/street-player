name: StreetPlayer
options:
  bundleIdPrefix: com.bartoszrychlicki
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.0.0
targets:
  StreetPlayer:
    type: application
    platform: iOS
    sources:
      - path: StreetPlayer
        excludes:
          - LiveActivity/WalkLiveActivityView.swift
    info:
      path: StreetPlayer/App/Info.plist
      properties:
        NSLocationAlwaysAndWhenInUseUsageDescription: Street Player records your walk in the background so captured squares can be confirmed after you finish.
        NSLocationWhenInUseUsageDescription: Street Player uses your location to draw your active walk and estimate captured grid squares.
        NSSupportsLiveActivities: true
        StreetPlayerAPIBaseURL: https://street-player.vercel.app
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.street-player-simulator-local
        UIBackgroundModes:
          - location
        UILaunchStoryboardName: LaunchScreen
    entitlements:
      path: StreetPlayer/App/StreetPlayer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartoszrychlicki.streetplayer
        PRODUCT_NAME: Street Player
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: MapLibre
        product: MapLibre
      - target: StreetPlayerWidgets
        embed: true
    scheme:
      testTargets:
        - StreetPlayerUITests
  StreetPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StreetPlayerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartoszrychlicki.streetplayer.uitests
        PRODUCT_NAME: Street Player UI Tests
        TEST_TARGET_NAME: StreetPlayer
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: StreetPlayer
  StreetPlayerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - StreetPlayerWidgets
      - StreetPlayer/LiveActivity/WalkActivityAttributes.swift
    info:
      path: StreetPlayerWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartoszrychlicki.streetplayer.widgets
        PRODUCT_NAME: Street Player Widgets
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.10
